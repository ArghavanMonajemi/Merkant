services:
  backend:
    build:
      context: .
      target: dev
    container_name: django-docker
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src/merkant:/app
    depends_on:
      - redis

  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: on-failure
    ports:
      - '5000:80'
      - '25:25'
      - '143:143'
      - '110:110'
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

  redis:
    image: redis
    command: redis-server --save 60 1 --loglevel warning
    restart: always
    ports:
      - "6379:6379"

volumes:
  smtp4dev-data: