services:
  backend:
    build:
      context: .
      target: prod.
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
    - redis
    - db:
      condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis
    command: redis-server --save 60 1 --loglevel warning
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: